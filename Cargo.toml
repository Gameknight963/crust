[package]
name = "crust"
version = "0.1.0"
edition = "2024"
description = "An experimental C-like language with ownership checking"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde", "std"] }

[lints.clippy]
# Keep explicit returns while the implementation is also a Rust learning project.
needless_return = "allow"
